$kind: http-request
name: Change Password
method: PATCH
url: '{{baseUrl}}/users/:userId/password'
order: 3330
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: userId
    value: '1'
body:
  type: json
  content: |-
    {
      "currentPassword": "oldPassword123",
      "newPassword": "newPassword456"
    }
